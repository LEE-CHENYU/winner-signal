[project]
name = "winner-signal-analysis"
version = "0.1.0"
description = "Winner Signal analysis service — video claim extraction and evidence review"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
    "google-genai>=1.14.0",
    "google-auth-oauthlib>=1.2.0",
    "cryptography>=44.0.0",
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",
    "python-multipart>=0.0.12",
]

[project.scripts]
serve = "analysis.main:run"

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analysis"]
