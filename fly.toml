app = "winner-signal-api"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = "45s"

[build]
  dockerfile = "Dockerfile"

[env]
  WINNER_DATA_DIR = "/data"
  COOKIE_SECURE = "1"
  PUBLIC_ORIGIN = "https://winner-signal.vercel.app"
  MAX_DAILY_ANALYSES = "8"

[[mounts]]
  source = "winner_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
